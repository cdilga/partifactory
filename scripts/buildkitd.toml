# One reusable release/fixture cache. GC also bounds growth during a long build;
# scripts/oci-builder.sh prunes the selected builder after every success/failure.
[worker.oci]
  gc = true
  reservedSpace = "1GB"
  maxUsedSpace = "10GB"
  minFreeSpace = "20GB"

[[worker.oci.gcpolicy]]
  all = true
  reservedSpace = "1GB"
  maxUsedSpace = "10GB"
  minFreeSpace = "20GB"
