# Native Mac server: only the host process may reach CDP/controller through loopback.
services:
  # The host-process regression lane uses the same native vendor-image variant for both
  # helpers. Docker's classic image store cannot concurrently load two variants under
  # the same canonical index digest. Release mode never loads this overlay. The shipped
  # compose pins the amd64 child manifest, so the native lane names the index instead.
  partifactory-render:
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    platform: ${PF_HARNESS_NATIVE_PLATFORM:-linux/amd64}
  render-host-relay:
    profiles: ["render"]
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    platform: ${PF_HARNESS_NATIVE_PLATFORM:-linux/amd64}
    labels: {pf.harness: "1"}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    user: "1000:1000"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    cpus: 0.5
    command: ["python3", "/opt/pf-render/host-relay.py"]
    volumes:
      - ${PF_REPO_ROOT:?}/deploy/render/host-relay.py:/opt/pf-render/host-relay.py:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks:
      ingress: {}
      render:
        ipv4_address: 172.30.78.40
    ports:
      - "127.0.0.1:19222:9222"
      - "127.0.0.1:19223:9223"
