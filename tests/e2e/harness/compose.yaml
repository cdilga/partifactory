# The e2e harness (pf-kurh): Caddy with the shipped Caddyfile and a per-run CA cert, two Dex
# instances, and (in container mode) partifactory itself with `_FILE` secrets.
#
# Driven by tests/e2e/harness/up.sh and down.sh (ci/e2e.sh wraps both). Never run it by hand
# without `docker compose down -v --remove-orphans` afterwards. Everything here carries the label
# pf.harness=1 so cleanup can find it.
#
# Env (set by up.sh):
#   PF_RUN_DIR            this run's dir (certs/, dex/, secrets/, site.toml, data/)
#   PF_UPSTREAM_WORKSPACE / PF_UPSTREAM_CONTENT  where Caddy finds partifactory
#   PF_HTTPS_PORT         host port for Caddy's 443 (default 18443)
#   PF_BIN                (container mode) a Linux partifactory binary
#   PF_IMAGE_TAG          one tag per commit, so runs never pile up untagged images

name: pf-harness

x-labels: &labels
  pf.harness: "1"

networks:
  security-device:
    labels: *labels
    ipam:
      config:
        - subnet: 172.30.79.0/24
  render:
    internal: true
    labels: *labels
    ipam:
      config:
        - subnet: 172.30.78.0/24
  harness:
    labels: *labels
    ipam:
      config:
        - subnet: 172.30.77.0/24

volumes:
  pf-data:
    labels: *labels

services:
  security-device-client:
    profiles: [security]
    image: pf-harness-browsers:1.64.1
    labels: *labels
    restart: "no"
    entrypoint: ["python3", "/opt/pf-security/run.py"]
    volumes:
      - ../../security:/opt/pf-security:ro
      - ${PF_RUN_DIR:?}:/run/pf/run
    networks:
      security-device:
        ipv4_address: 172.30.79.40
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  security-canary:
    image: pf-harness-browsers:1.64.1
    labels: *labels
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["python3", "/opt/pf-security/canary.py"]
    volumes:
      - ../../security/canary.py:/opt/pf-security/canary.py:ro
    networks: [harness]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  partifactory-render:
    profiles: ["render"]
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    labels: *labels
    user: "1000:1000"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 256
    cpus: 1
    tmpfs: ["/tmp:rw,nosuid,nodev,size=256m,mode=1777"]
    environment:
      HOME: /tmp
      PF_RENDER_APEX: ${PF_APEX:-pf.test}
      PF_RENDER_GATEWAY: ${PF_RENDER_GATEWAY:-partifactory}
    command: ["python3", "/opt/pf-render/controller.py"]
    volumes:
      - ../../../deploy/render/controller.py:/opt/pf-render/controller.py:ro
      - ${PF_RUN_DIR:?}/render-public:/run/pf-render:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks:
      render:
        ipv4_address: 172.30.78.30
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  caddy:
    image: caddy:2.11.4-alpine
    labels: *labels
    restart: "no"
    depends_on: [security-canary]
    ports:
      - "127.0.0.1:${PF_HTTPS_PORT:-18443}:443"
    environment:
      PF_APEX: ${PF_APEX:-pf.test}
      PF_UPSTREAM_WORKSPACE: ${PF_UPSTREAM_WORKSPACE:-partifactory:8080}
      PF_UPSTREAM_CONTENT: ${PF_UPSTREAM_CONTENT:-partifactory:8081}
      PF_CDN_UPSTREAM: ${PF_CDN_UPSTREAM:-unused}
    volumes:
      # The shipped config, unchanged; only the cert paths are this run's.
      - ../../../deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../../deploy/proxy:/srv/pf-proxy:ro
      - ${PF_RUN_DIR:?}/certs/cert.pem:/etc/caddy/certs/cert.pem:ro
      - ${PF_RUN_DIR:?}/certs/key.pem:/etc/caddy/certs/key.pem:ro
      - ./sites.d:/etc/caddy/sites.d:ro
      - ./fake-cdn:/srv/pf-cdn:ro
    # Caddy's state is per run: tmpfs, not the image's anonymous volumes.
    tmpfs: [/data, /config]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      security-device:
        ipv4_address: 172.30.79.10
      harness:
        ipv4_address: 172.30.77.10
        aliases: [dex.pf.test, dex2.pf.test, parts.pf.test]

  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    labels: *labels
    restart: "no"
    command: ["dex", "serve", "/etc/dex/dex.yaml"]
    volumes:
      - ${PF_RUN_DIR:?}/dex/dex.yaml:/etc/dex/dex.yaml:ro
    networks: [harness]

  dex2:
    image: ghcr.io/dexidp/dex:v2.45.1
    labels: *labels
    restart: "no"
    command: ["dex", "serve", "/etc/dex/dex.yaml"]
    volumes:
      - ${PF_RUN_DIR:?}/dex/dex2.yaml:/etc/dex/dex.yaml:ro
    networks: [harness]

  # Playwright (all four projects) on the harness network: `docker compose run --rm browsers
  # <playwright args>`. The repo is mounted at /repo (node_modules installed on the host by
  # ci/e2e.sh; @playwright/test is plain JS). Fixed names resolve to Caddy through /etc/hosts;
  # Chromium maps the whole wildcard with --host-resolver-rules.
  browsers:
    profiles: ["browsers"]
    image: pf-harness-browsers:1.64.1
    build:
      context: .
      dockerfile: Dockerfile.browsers
    labels: *labels
    restart: "no"
    ipc: host
    init: true
    entrypoint: ["bash", "/repo/tests/e2e/harness/browsers-entry.sh"]
    environment:
      CI: ${CI:-}
      PF_E2E_RUN: ${PF_E2E_RUN:-local}
      PF_HARNESS_IP: 172.30.77.10
      PF_FIREFOX_PROFILE: /tmp/pf-firefox-profile
      PF_ORIGIN_DOWN: ${PF_ORIGIN_DOWN:-}
      PF_E2E_RENDER: ${PF_E2E_RENDER:-0}
      PF_SECURITY_DEVICE_FILE: ${PF_SECURITY_DEVICE_FILE:-}
      HOST_UID: ${HOST_UID:-}
      HOST_GID: ${HOST_GID:-}
    volumes:
      - ../../..:/repo
      - ${PF_RUN_DIR:?}/certs/ca.pem:/run/pf/ca.pem:ro
      - ${PF_RUN_DIR:?}:/run/pf/run:ro
    extra_hosts:
      - "parts.pf.test:172.30.77.10"
      - "notes-part.pf.test:172.30.77.10"
      - "pixel-part.pf.test:172.30.77.10"
      - "public-pixel-part.pf.test:172.30.77.10"
      - "pixel-chromium-desktop-part.pf.test:172.30.77.10"
      - "pixel-chromium-mobile-part.pf.test:172.30.77.10"
      - "pixel-webkit-mobile-part.pf.test:172.30.77.10"
      - "pixel-firefox-desktop-part.pf.test:172.30.77.10"
      - "pixel-undo-chromium-desktop-part.pf.test:172.30.77.10"
      - "pixel-undo-chromium-mobile-part.pf.test:172.30.77.10"
      - "pixel-undo-webkit-mobile-part.pf.test:172.30.77.10"
      - "pixel-undo-firefox-desktop-part.pf.test:172.30.77.10"
      - "device-part.pf.test:172.30.77.10"
      - "wrapper-draft-chromium-desktop-part.pf.test:172.30.77.10"
      - "wrapper-draft-webkit-mobile-part.pf.test:172.30.77.10"
      - "markdown-part.pf.test:172.30.77.10"
      - "text-part.pf.test:172.30.77.10"
      - "bundle-part.pf.test:172.30.77.10"
      - "mirrored-part.pf.test:172.30.77.10"
      - "demo-part.pf.test:172.30.77.10"
      - "blobs-part.pf.test:172.30.77.10"
      - "forge.pf.test:172.30.77.10"
      - "dex.pf.test:172.30.77.10"
      - "dex2.pf.test:172.30.77.10"
    networks: [harness]

  # Container mode only (Linux CI): partifactory from a binary built on the runner.
  # On a Mac the harness runs the native binary on the host instead (up.sh), and Caddy reaches
  # it through host.docker.internal.
  partifactory:
    profiles: ["container"]
    image: ubuntu:24.04
    labels: *labels
    restart: "no"
    command: ["/usr/local/bin/partifactory", "serve"]
    environment:
      PF_SITE_TOML: /run/pf/site.toml
      PF_DATA_DIR: /data
      PF_DEV_API_TOKEN_FILE: /run/secrets/api_token
      PF_DEV_IDENTITY: /run/pf/identity.toml
      PF_IDP_CLIENT_SECRET_FILE: /run/secrets/idp_client_secret
      PF_SESSION_KEY_FILE: /run/secrets/session_key
      PF_CAP_HMAC_KEY_FILE: /run/secrets/cap_hmac_key
      PF_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      PF_LOG: info
      PF_RENDER_PUBLIC_DIR: /run/pf-render
      PF_LISTEN_RENDER: 172.30.78.20:443
      PF_RENDER_CDP: http://172.30.78.30:9222
      PF_RENDER_CONTROL: http://172.30.78.30:9223
      PF_DEV_LOG_RING: "20000"
      SSL_CERT_FILE: /run/pf/ca.pem
    volumes:
      - ${PF_BIN:-/nonexistent}:/usr/local/bin/partifactory:ro
      - ${PF_RUN_DIR:?}/site.toml:/run/pf/site.toml:ro
      - ${PF_RUN_DIR:?}/identity.toml:/run/pf/identity.toml:ro
      - ${PF_RUN_DIR:?}/certs/ca.pem:/run/pf/ca.pem:ro
      - ${PF_RUN_DIR:?}/secrets:/run/secrets:ro
      # The private job daemon sees this same checkout. Real CLI recovery and cross-surface
      # conformance inspect the consistent database without a second data-copy mechanism.
      - ${PF_RUN_DIR:?}/data:/data
      - ${PF_RUN_DIR:?}/render-public:/run/pf-render
    ports:
      # The ops listener, for the gate's curl; local only, never through Caddy.
      - "127.0.0.1:19090:9090"
    networks:
      render:
        ipv4_address: 172.30.78.20
      harness:
        ipv4_address: 172.30.77.20
