# Item 12 through nginx. Draft only (example configs ship after Slice 1).
#   :443  "tuned"  - the settings partifactory needs (WebSocket upgrade, no buffering, long reads)
#   :8443 "naive"  - a bare proxy_pass, to show what breaks without them
events {}
http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/key.pem;
    location / {
      proxy_pass http://host.docker.internal:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }
  }

  server {
    listen 8443 ssl;
    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/key.pem;
    location / {
      proxy_pass http://host.docker.internal:8080;
      proxy_set_header Host $http_host;
    }
  }
}
