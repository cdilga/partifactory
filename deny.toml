# cargo-deny: licences, bans, sources and advisories. Runs on every PR (ci/deny.sh) and
# nightly on main (ci/advisories.sh).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained only, no vulnerability: syntect's embedded syntax and theme dumps
    # need bincode 1.3.3, which its authors declared complete. Revisit with syntect 6.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is complete; syntect dump-load needs it" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
