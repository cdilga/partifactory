<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>503 · DOWN FOR MAINTENANCE</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1b17;--mute:#6b665c;--line:#d8d2c4}
@media (prefers-color-scheme:dark){:root{--bg:#16150f;--fg:#ece8dd;--mute:#9b968a;--line:#34312a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
main{width:100%;max-width:36rem;padding:2rem 16px;border-top:2px solid var(--fg)}
h1{font-size:1.25rem;letter-spacing:.08em;margin:0 0 .5rem}
p{margin:.25rem 0}
.mute{color:var(--mute);font-size:.85rem;border-top:1px solid var(--line);margin-top:1rem;padding-top:.5rem}
</style>
</head>
<body>
<main>
<h1>503 · DOWN FOR MAINTENANCE</h1>
<p>partifactory is restarting or being updated. Your parts are safe.</p>
<p>Try again in a minute.</p>
<p class="mute">Served by the proxy because the server is not answering.</p>
</main>
</body>
</html>
