[package]
name = "pf-links"
description = "Admin public links, guest capability minting and reversible freeze/revoke"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
dev = ["pf-serve/dev", "pf-auth/dev"]

[dependencies]
axum = "0.8"
base64 = "0.22"
getrandom = "0.4"
http = "1"
pf-auth = { path = "../pf-auth" }
pf-blobs = { path = "../pf-blobs" }
pf-caps = { path = "../pf-caps" }
pf-db = { path = "../pf-db" }
pf-model = { path = "../pf-model" }
pf-obs = { path = "../pf-obs" }
pf-serve = { path = "../pf-serve" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tracing.workspace = true

[dev-dependencies]
pf-config = { path = "../pf-config", features = ["dev"] }
tokio = { version = "1", features = ["rt", "macros"] }
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
