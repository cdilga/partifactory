[package]
name = "pf-mcp"
description = "The MCP adapter (Streamable HTTP, stateless) over the op registry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
dev = ["pf-serve/dev"]

[dependencies]
axum = "0.8"
base64 = "0.22"
http = "1"
pf-api = { path = "../pf-api" }
pf-model = { path = "../pf-model" }
pf-obs = { path = "../pf-obs" }
pf-ops = { path = "../pf-ops" }
pf-serve = { path = "../pf-serve" }
png = "0.18"
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
tracing.workspace = true
url = "2"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }
jsonschema = { version = "0.33", default-features = false }
pf-cli = { path = "../pf-cli" }
pf-auth = { path = "../pf-auth", features = ["dev"] }
pf-blobs = { path = "../pf-blobs" }
pf-caps = { path = "../pf-caps" }
pf-config = { path = "../pf-config" }
pf-db = { path = "../pf-db" }
pf-oauth = { path = "../pf-oauth" }
tempfile.workspace = true
rmcp = { version = "=3.7.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
