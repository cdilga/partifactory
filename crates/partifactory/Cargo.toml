[package]
name = "partifactory"
description = "partifactory: one static binary; `part` is its CLI alias"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "partifactory"
path = "src/main.rs"

[features]
# Dev-only subcommands and fixtures (`partifactory dev …`). Never in release builds.
dev = ["pf-serve/dev", "pf-auth/dev"]

[dependencies]
clap.workspace = true
pf-auth = { path = "../pf-auth" }
pf-blobs = { path = "../pf-blobs" }
pf-caps = { path = "../pf-caps" }
pf-cli = { path = "../pf-cli" }
pf-config = { path = "../pf-config" }
pf-db = { path = "../pf-db" }
pf-model = { path = "../pf-model" }
pf-obs = { path = "../pf-obs" }
pf-serve = { path = "../pf-serve" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "sync"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true
