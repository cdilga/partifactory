[package]
name = "pf-auth"
description = "People sign-in: generic OIDC, sessions, the claims directory and admin step-up"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# The fixture directory (`StaticDirectory`, `TestSession`). Never in release builds.
dev = ["dep:toml", "dep:serde"]

[dependencies]
getrandom = "0.3"
pf-db = { path = "../pf-db" }
serde = { workspace = true, optional = true }
sha2 = "0.10"
thiserror.workspace = true
toml = { workspace = true, optional = true }
tracing.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tracing-subscriber.workspace = true

[[test]]
name = "no_network"
required-features = ["dev"]

[lints]
workspace = true
