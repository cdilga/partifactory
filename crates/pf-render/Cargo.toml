[package]
name = "pf-render"
description = "The render sidecar client for `part_check`: screenshots, actions and the after_check gate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64 = "0.22"
chromiumoxide = "0.9.1"
futures-util = { version = "0.3", features = ["sink"] }
pf-blobs = { path = "../pf-blobs" }
pf-build = { path = "../pf-build" }
pf-caps = { path = "../pf-caps" }
pf-db = { path = "../pf-db" }
pf-model = { path = "../pf-model" }
pf-ops = { path = "../pf-ops" }
pf-obs = { path = "../pf-obs" }
pf-parthost = { path = "../pf-parthost" }
pf-serve = { path = "../pf-serve" }
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing.workspace = true
url = "2"

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
