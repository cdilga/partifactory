[package]
name = "pf-backup"
description = "Export and import: consistent DB copies, the nightly export, import with the boot-epoch bump"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
dev = ["pf-auth/dev", "pf-serve/dev"]

[dependencies]
age = { version = "0.11.5", default-features = false }
axum = "0.8"
fs4 = "0.13"
pf-auth = { path = "../pf-auth" }
pf-blobs = { path = "../pf-blobs" }
pf-caps = { path = "../pf-caps" }
pf-config = { path = "../pf-config" }
pf-db = { path = "../pf-db" }
pf-janitor = { path = "../pf-janitor" }
pf-model = { path = "../pf-model" }
pf-obs = { path = "../pf-obs" }
pf-serve = { path = "../pf-serve" }
prometheus = "0.14"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tar = "0.4"
tempfile.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["sync", "time", "rt"] }
tracing.workspace = true
zstd = "0.13"

[dev-dependencies]
pf-model = { path = "../pf-model" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
