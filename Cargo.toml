[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
zeroize = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
proptest = "1"
tempfile = "3"

# Build hygiene (AGENTS.md "Disk hygiene"): dependencies carry no debuginfo,
# the workspace only line tables, and CI builds without incremental state.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.ci]
inherits = "dev"
incremental = false
debug = false

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true

# The embedded Stockroom hydration bundle, built by scripts/build-ui.sh.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false
