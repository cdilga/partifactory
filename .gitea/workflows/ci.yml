# The repo's own CI. Every job is one ci/*.sh script, so a laptop runs exactly what CI runs.
# Runners are chosen by the generic labels `rust` and `browser`; the forge is incidental.
name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.schedule }}-${{ inputs.job }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: "advisories, renovate, negative-fmt/clippy/gitleaks (blank runs PR checks)"
        required: false
        default: ""
  schedule:
    - cron: "17 3 * * *" # nightly advisories on main
    - cron: "41 4 * * 1" # weekly Renovate

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # rustup's asynchronous CloseHandle worker has repeatedly panicked and hung
  # before project checks. Its documented single-threaded IO path avoids that
  # worker while retaining the exact toolchain and every installed component.
  RUSTUP_IO_THREADS: "1"

jobs:
  negative-check:
    # Manual failure evidence for pf-tokl. Each checker must turn its run red;
    # disposable inputs never enter main or its secret-scanned history.
    if: github.event_name == 'workflow_dispatch' && (inputs.job == 'negative-fmt' || inputs.job == 'negative-clippy' || inputs.job == 'negative-gitleaks')
    name: ${{ inputs.job }}
    runs-on: [rust, rust-truenas]
    env:
      PF_NEGATIVE_SELECTOR: ${{ inputs.job }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: tools
        run: ci/install-tools.sh "${PF_NEGATIVE_SELECTOR#negative-}"
      - name: checker must reject fixture
        run: ci/negative-check.sh "${PF_NEGATIVE_SELECTOR#negative-}"

  checks:
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.job == '')
    runs-on: [rust, rust-truenas] # triton's disk is full; prefer the truenas pool
    strategy:
      fail-fast: false
      matrix:
        script: [fmt, clippy, test, deny, audit, gitleaks, check-boundaries, env-docs, selftest, store-durability, spikes, ui]
    name: ${{ matrix.script }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0 # gitleaks scans the history
      - name: toolchain
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: cache dirs
        # Reuse downloaded crates; compiled artifacts stay in this checkout's one target/.
        run: |
          if [ -d /cargo-cache ]; then
            echo "CARGO_HOME=/cargo-cache/partifactory/cargo" >> "$GITHUB_ENV"
            mkdir -p /cargo-cache/partifactory/cargo/bin
            echo "/cargo-cache/partifactory/cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: tools
        run: ci/install-tools.sh "${{ matrix.script }}"
      - name: run
        env:
          NEXTEST_PROFILE: ci
        run: ci/${{ matrix.script }}.sh
      - name: native execution evidence
        if: always() && matrix.script == 'test'
        uses: actions/upload-artifact@v3
        with:
          name: native-test-evidence
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
      - name: clean
        if: always()
        run: PF_CLEAN_NO_DOCKER=1 scripts/clean-build.sh --apply || true

  spike:
    # pf-6qma: the opaque-origin sandbox rig on the five Playwright projects (throwaway; the
    # part host bead keeps what it needs as regression fixtures).
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.job == '')
    runs-on: [browser, rust-truenas]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: run
        run: ci/spike.sh
      - name: results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: sandbox-spike
          path: |
            target/sandbox-spike/results.jsonl
            target/sandbox-spike/results.md
            target/sandbox-spike/screens/
      - name: clean
        if: always()
        run: docker rm --force $(docker ps -aq --filter label=pf.spike=1) 2>/dev/null || true

  e2e:
    # pf-kurh: the e2e harness (Caddy with deploy/proxy/Caddyfile and a per-run CA, two Dex,
    # partifactory in a container, Playwright on the four projects). Every failure blocks CI.
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.job == '')
    runs-on: [browser, rust-truenas]
    container:
      image: catthehacker/ubuntu:act-22.04@sha256:3cdab37904fc1798c460f1fadd47fd2c4d24fa2f292d1b57fc12eff072b415ec
      # act_runner deliberately overrides --privileged with its host policy. Grant the
      # capabilities needed by this job's private daemon explicitly instead.
      # SYS_PTRACE lets dockerd bind /proc/<non-root child>/ns/net during bridge setup.
      # The 16 GiB job holds an 8 GiB image store and a bounded 6 GiB build worker.
      options: --cap-add=SYS_ADMIN --cap-add=NET_ADMIN --cap-add=SYS_RESOURCE --cap-add=SYS_PTRACE --security-opt=seccomp=unconfined --security-opt=apparmor=unconfined --memory=16g --memory-swap=16g
    env:
      DOCKER_HOST: unix:///var/run/pf-ci-docker.sock
      PF_E2E_RENDER: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python harness runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: toolchain
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
      - name: cache dirs
        run: |
          if [ -d /cargo-cache ]; then
            echo "CARGO_HOME=/cargo-cache/partifactory/cargo" >> "$GITHUB_ENV"
          fi
      - name: tools
        # Browser CA tools are in Dockerfile.browsers. Node runs npm ci on the runner.
        run: |
          need=""
          command -v node >/dev/null || need="$need nodejs npm"
          command -v zstd >/dev/null || need="$need zstd"
          if [ -n "$need" ]; then
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
            $SUDO apt-get update -qq && DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y -qq $need >/dev/null
          fi
      - name: run
        run: |
          bash ci/docker-daemon.sh
          ci/e2e.sh
      - name: communal pixel editor acceptance
        # The normal suite tears down its seeded harness first. This gate creates the
        # contract board through real scoped HTTP and rmcp device agents on a fresh one.
        run: tests/device/communal-pixel.sh
      - name: communal pixel editor evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: communal-pixel-editor-evidence
          path: |
            target/e2e-logs/cpx-*/communal_pixel_editor/report.json
            target/e2e-logs/cpx-*/communal_pixel_editor/*/report.json
            target/e2e-logs/cpx-*/communal_pixel_editor/*/*.png
          if-no-files-found: error
      - name: logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-logs
          path: target/e2e-logs/
      - name: security execution evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-test-evidence
          path: |
            target/e2e-logs/run-*/results-main.json
            target/e2e-logs/run-*/security/report.json
            target/e2e-logs/run-*/summary.txt
            target/e2e-logs/run-*/proxy-runtime-log-gate.json
      - name: clean
        if: always()
        run: |
          tests/e2e/harness/down.sh || true
          if [ -f /tmp/pf-ci-docker.pid ]; then kill "$(cat /tmp/pf-ci-docker.pid)" || true; fi
          PF_CLEAN_NO_DOCKER=1 scripts/clean-build.sh --apply || true

  shipping-gates:
    # Each matrix job owns a daemon and a fresh harness. Pressure never shares live data
    # with the normal browser/device gates, and cannot satisfy its gate by being skipped.
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.job == '')
    runs-on: [browser, rust-truenas]
    strategy:
      fail-fast: false
      matrix:
        script: [security-release, storage-pressure]
    name: ${{ matrix.script }}
    container:
      image: catthehacker/ubuntu:act-22.04@sha256:3cdab37904fc1798c460f1fadd47fd2c4d24fa2f292d1b57fc12eff072b415ec
      options: --cap-add=SYS_ADMIN --cap-add=NET_ADMIN --cap-add=SYS_RESOURCE --cap-add=SYS_PTRACE --security-opt=seccomp=unconfined --security-opt=apparmor=unconfined --memory=16g --memory-swap=16g
    env:
      DOCKER_HOST: unix:///var/run/pf-ci-docker.sock
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python harness runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: toolchain
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
      - name: cache dirs
        run: |
          if [ -d /cargo-cache ]; then
            echo "CARGO_HOME=/cargo-cache/partifactory/cargo" >> "$GITHUB_ENV"
          fi
      - name: tools
        run: |
          need=""
          command -v node >/dev/null || need="$need nodejs npm"
          command -v zstd >/dev/null || need="$need zstd"
          if [ -n "$need" ]; then
            task_sudo=""; [ "$(id -u)" = 0 ] || task_sudo=sudo
            $task_sudo apt-get update -qq
            DEBIAN_FRONTEND=noninteractive $task_sudo apt-get install -y -qq $need >/dev/null
          fi
      - name: run
        run: |
          bash ci/docker-daemon.sh
          ci/${{ matrix.script }}.sh
      - name: execution evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.script }}-test-evidence
          path: |
            target/e2e-logs/release-*/results*.json
            target/e2e-logs/release-*/device-reports/
            target/e2e-logs/release-*/security/report.json
            target/e2e-logs/release-*/proxy-runtime-log-gate.json
            target/e2e-logs/release-*/summary.txt
            target/e2e-logs/devices-*/results.json
            target/e2e-logs/devices-*/device-reports/
            target/e2e-logs/pressure-*/results.json
            target/e2e-logs/pressure-*/stores.txt
            target/e2e-logs/pressure-*/tests/**/*.png
            target/e2e-logs/pressure-*/tests/**/metrics-*.txt
      - name: exact release assets for downstream deployment gate
        if: always() && matrix.script == 'security-release'
        uses: actions/upload-artifact@v3
        with:
          name: shipping-release-assets
          path: |
            target/release-assets/RELEASE.json
            target/release-assets/digest.txt
            target/release-assets/SHA256SUMS
            target/release-assets/part-linux-amd64.tar.gz
            target/release-assets/partifactory-linux-amd64.oci.tar
          if-no-files-found: error
      - name: clean
        if: always()
        run: |
          tests/e2e/harness/down.sh || true
          if [ -f /tmp/pf-ci-docker.pid ]; then kill "$(cat /tmp/pf-ci-docker.pid)" || true; fi
          PF_CLEAN_NO_DOCKER=1 scripts/clean-build.sh --apply || true

  deploy:
    # Reuse the exact checksummed image/CLI bytes observed by the release lane.
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.job == '')
    needs: [shipping-gates]
    runs-on: [browser, rust-truenas]
    container:
      image: catthehacker/ubuntu:act-22.04@sha256:3cdab37904fc1798c460f1fadd47fd2c4d24fa2f292d1b57fc12eff072b415ec
      options: --cap-add=SYS_ADMIN --cap-add=NET_ADMIN --cap-add=SYS_RESOURCE --cap-add=SYS_PTRACE --security-opt=seccomp=unconfined --security-opt=apparmor=unconfined --memory=16g --memory-swap=16g
    env:
      DOCKER_HOST: unix:///var/run/pf-ci-docker.sock
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@v3
        with:
          name: shipping-release-assets
          path: target/release-assets
      - name: Python harness runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
      - name: cache dirs
        run: |
          if [ -d /cargo-cache ]; then echo "CARGO_HOME=/cargo-cache/partifactory/cargo" >> "$GITHUB_ENV"; fi
      - name: tools
        run: |
          need=""
          command -v node >/dev/null || need="$need nodejs npm"
          command -v zstd >/dev/null || need="$need zstd"
          if [ -n "$need" ]; then
            task_sudo=""; [ "$(id -u)" = 0 ] || task_sudo=sudo
            $task_sudo apt-get update -qq
            DEBIAN_FRONTEND=noninteractive $task_sudo apt-get install -y -qq $need >/dev/null
          fi
      - name: actual release deploy, rollback and second-daemon drill
        run: |
          bash ci/docker-daemon.sh
          ci/deploy.sh
      - name: public deployment evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: deployment-test-evidence
          path: target/e2e-logs/deploy-*/public/
          if-no-files-found: error
      - name: clean
        if: always()
        run: |
          if [ -f /tmp/pf-ci-docker.pid ]; then kill "$(cat /tmp/pf-ci-docker.pid)" || true; fi
          PF_CLEAN_NO_DOCKER=1 scripts/clean-build.sh --apply || true

  security-evidence:
    # Merge only artifacts of this workflow. Missing/skipped expected Linux gates fail;
    # the separately observed Mac Simulator lane remains explicitly outside this platform.
    if: always() && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.job == '')
    needs: [checks, e2e, shipping-gates, deploy]
    runs-on: [rust, rust-truenas]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@v3
        with:
          path: target/security-inputs
      - name: verify observed evidence
        run: ci/security-evidence.sh
      - name: report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-evidence-report
          path: target/e2e-logs/security-aggregate/

  advisories:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 3 * * *') || (github.event_name == 'workflow_dispatch' && inputs.job == 'advisories')
    runs-on: [rust, rust-truenas] # triton's disk is full; prefer the truenas pool
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
      - run: ci/install-tools.sh advisories
      - run: ci/advisories.sh
      - if: always()
        run: PF_CLEAN_NO_DOCKER=1 scripts/clean-build.sh --apply || true

  renovate:
    # Inert until the admin adds the RENOVATE_TOKEN repo secret (a human check).
    if: (github.event_name == 'schedule' && github.event.schedule == '41 4 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.job == 'renovate')
    runs-on: [rust, rust-truenas] # triton's disk is full; prefer the truenas pool
    container:
      image: renovate/renovate:41@sha256:e998e1218fe572e23278d8808186a310784f7cb2ac8055307183ffc51d3a59e5
    steps:
      - name: renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_PLATFORM: gitea
          RENOVATE_ENDPOINT: ${{ github.server_url }}/api/v1
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then echo "renovate: RENOVATE_TOKEN not set; skipping"; exit 0; fi
          renovate
