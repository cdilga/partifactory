# The forge only calls the same release script an operator can run from a laptop.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: [browser]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: publish digest-pinned image and offline assets
        env:
          PF_RELEASE_IMAGE: ${{ secrets.PF_RELEASE_IMAGE }}
          PF_RELEASE_REGISTRY_USER: ${{ secrets.PF_RELEASE_REGISTRY_USER }}
          PF_RELEASE_REGISTRY_PASSWORD: ${{ secrets.PF_RELEASE_REGISTRY_PASSWORD }}
          PF_RELEASE_TOKEN: ${{ secrets.PF_RELEASE_TOKEN }}
          PF_RELEASE_API: ${{ github.api_url }}/repos/${{ github.repository }}
        run: ci/release.sh
      - name: release assets
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: release-assets
          path: |
            target/release-assets/RELEASE.json
            target/release-assets/digest.txt
            target/release-assets/SHA256SUMS
            target/release-assets/part-linux-amd64.tar.gz
            target/release-assets/partifactory-linux-amd64.oci.tar
          if-no-files-found: warn
